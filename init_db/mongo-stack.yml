version: '3.3'

services:
  mongodb:
    image: mongo:4.2
    hostname: ev_mongo
    ports:
    - 27017:27017
    volumes:
    - "mongodb:/data/db"
    - "./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh"
    env_file:
    - ev_mongo.env
    command: --replSet 'rs0'
    networks:
      ev_network:
        aliases:
        - ev_mongo
  enablereplset:
    depends_on:
    - mongodb
    image: mongo:4.2
    links:
    - mongodb
    networks:
    - ev_network
    environment:
      WAIT_HOSTS: ev_mongo:27017
      WAIT_HOSTS_TIMEOUT: 90
  mongo-express:
    image: mongo-express
    restart: always
    ports:
    - $MONGO_EXPRESS_DOCKER_PORT:$MONGO_EXPRESS_APP_PORT
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME:  $MONGO_INITDB_ROOT_USERNAME
      ME_CONFIG_MONGODB_ADMINPASSWORD: $MONGO_INITDB_ROOT_PASSWORD
      ME_CONFIG_MONGODB_SERVER: $MONGO_EXPRESS_SERVER
      ME_CONFIG_MONGODB_AUTH_DATABASE: $MONGO_EXPRESS_AUTH_DATABASE
      ME_CONFIG_MONGODB_AUTH_USERNAME: $MONGO_EXPRESS_AUTH_USERNAME
      ME_CONFIG_MONGODB_AUTH_PASSWORD: $MONGO_EXPRESS_AUTH_PASSWORD
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME:  $MONGO_EXPRESS_BASICAUTH_USERNAME
      ME_CONFIG_BASICAUTH_PASSWORD:  $MONGO_EXPRESS_BASICAUTH_PASSWORD 
    networks:
    - ev_network

volumes:
  mongodb:

networks:
  ev_network:
    driver: overlay
    attachable: true
    external: true


