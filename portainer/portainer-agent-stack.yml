version: '3.2'

services:
  agent:
    container_name: portainer_agent
    image: portainer/agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - cpo_web_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    container_name: portainer_ce
    image: portainer/portainer-ce
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    ports:
      - "${PORTAINER_PORT}:9000"
      - "${PORTAINER_AGENT_PORT}:8000"
    volumes:
      - portainer_data:/data
    networks:
      - cpo_web_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  cpo_web_network:
    driver: overlay
    attachable: true

volumes:
  portainer_data:
