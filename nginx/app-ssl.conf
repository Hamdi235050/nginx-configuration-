include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

server {
    listen 80;
    server_name ${PORTAINER_SUB_DOMAIN};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name ${EXPRESS_SUB_DOMAIN};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name ${CPO_SERVER_SUB_DOMAIN};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name ${CPO_DASHBOARD_SUB_DOMAIN};
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 80;
    server_name ${CPO_ODATA_SUB_DOMAIN};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name ${CPO_OCPI_SUB_DOMAIN};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name ${CPO_OCPP_JSON_SUB_DOMAIN};
    # location / {
    #    return 301 wss://$host$request_uri;
    # }
    location / {
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cpo-ocpp-json-websocket;
    }
}

