server {
    listen 443 ssl;
    server_name ${PORTAINER_SUB_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${PORTAINER_SUB_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PORTAINER_SUB_DOMAIN}/privkey.pem;
    location / {
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://${PORTAINER_HOST}:${PORTAINER_PORT};
    }
}

